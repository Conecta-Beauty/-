<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App de Beleza & Agendamentos</title>
  
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* VARIABLES & THEME */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #2c3e50;
      --accent: #8e9eab;
      --text: #333333;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --success: #2e7d32;
      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: rgba(248, 249, 250, 0.95);
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 30px;
    }

    header {
      background: var(--primary);
      color: #ffffff;
      padding: 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      width: auto;
    }

    nav {
      display: none;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    nav button {
      flex: 1;
      padding: 12px 5px;
      border: none;
      background: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    nav button.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .view {
      display: none;
      padding: 16px;
      flex: 1;
    }

    .view.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card h3 {
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .btn-secondary {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      text-decoration: underline;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 8px;
      text-align: center;
      display: block;
    }

    /* BOX LINK DE COMPARTILHAMENTO */
    .share-link-box {
      background: #eef2f5;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--primary);
      margin-top: 10px;
    }

    .share-link-box label {
      font-weight: bold;
      font-size: 0.75rem;
      color: var(--primary);
      display: block;
      margin-bottom: 4px;
    }

    .share-input-group {
      display: flex;
      gap: 6px;
    }

    .share-input-group input {
      font-size: 0.8rem;
      background: #fff;
    }

    .share-input-group button {
      width: auto;
      white-space: nowrap;
      padding: 8px 12px;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .slot-btn {
      padding: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      text-align: center;
      cursor: pointer;
    }

    .slot-btn.selected {
      background: var(--primary);
      color: white;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1 id="appHeaderTitle">Gestão de Beleza</h1>
      <button id="btnLogout" class="btn-logout" onclick="handleLogout()" style="display: none;">Sair</button>
    </header>

    <nav id="appNav">
      <button class="nav-btn active" onclick="switchView('proDashboardView')">Painel</button>
      <button class="nav-btn" onclick="switchView('proConfigView')">Cadastros</button>
    </nav>

    <!-- 0. LOGIN / CADASTRO -->
    <section id="authView" class="view active">
      <div class="card">
        <h3 id="authTitle">Acesso do Profissional</h3>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="authEmail" placeholder="seuemail@exemplo.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="authPassword" placeholder="******">
        </div>
        
        <button id="btnAuthSubmit" class="btn-primary" onclick="handleAuthSubmit()">Entrar</button>
        <button class="btn-link" id="btnToggleAuthMode" onclick="toggleAuthMode()">Não tem uma conta? Cadastre-se</button>
      </div>
    </section>

    <!-- 1. PAINEL DO PROFISSIONAL -->
    <section id="proDashboardView" class="view">
      <div class="card">
        <div class="profile-header">
          <img id="dashLogo" src="https://via.placeholder.com/50" class="profile-img" alt="Logo">
          <div>
            <h2 id="dashName" style="font-size: 1rem;">Nome do Salão</h2>
            <p id="dashPhone" style="font-size: 0.75rem; color: var(--text-muted);"></p>
          </div>
        </div>

        <!-- BLANCO DE COMPARTILHAMENTO DO LINK DA CLIENTE -->
        <div class="share-link-box">
          <label>🔗 Seu Link de Agendamento:</label>
          <div class="share-input-group">
            <input type="text" id="shareLinkInput" readonly>
            <button onclick="copyShareLink()">Copiar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. VISÃO DA CLIENTE (ACESSADA PELO LINK) -->
    <section id="clientBookingView" class="view">
      <div class="card">
        <div class="profile-header">
          <img id="cliLogo" src="https://via.placeholder.com/50" class="profile-img" alt="Logo">
          <div>
            <h2 id="cliName" style="font-size: 1.1rem;">Studio de Beleza</h2>
            <p id="cliAddress" style="font-size: 0.75rem; color: var(--text-muted);"></p>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Agende seu Horário</h3>
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="cliClientName" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Selecione o Serviço</label>
          <select id="cliServiceSelect">
            <option value="">Corte e Escova - R$ 80,00</option>
            <option value="">Designer Sobrancelha - R$ 45,00</option>
          </select>
        </div>
        <div class="form-group">
          <label>Escolha o Horário</label>
          <div class="slots-grid">
            <button class="slot-btn selected">09:00</button>
            <button class="slot-btn">10:00</button>
            <button class="slot-btn">14:00</button>
          </div>
        </div>
        <button class="btn-primary" onclick="alert('Agendamento enviado com sucesso!')">Confirmar Agendamento</button>
      </div>
    </section>
  </div>

  <script>
    /* CONFIGURAÇÃO SUPABASE */
    const SUPABASE_URL = 'https://SEU_PROJETO.supabase.co';
    const SUPABASE_KEY = 'SUA_CHAVE_ANON_PUBLIC';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLoginMode = true;
    let currentUser = null;

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? 'Acesso do Profissional' : 'Novo Cadastro Profissional';
      document.getElementById('btnAuthSubmit').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
      document.getElementById('btnToggleAuthMode').innerText = isLoginMode 
        ? 'Não tem uma conta? Cadastre-se' 
        : 'Já possui cadastro? Faça Login';
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        alert('Preencha o e-mail e a senha.');
        return;
      }

      if (isLoginMode) {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('Erro ao entrar: ' + error.message);
      } else {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          alert('Erro ao cadastrar: ' + error.message);
        } else {
          alert('Cadastro realizado! Faça login para acessar o painel.');
          toggleAuthMode();
        }
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      checkUserSession();
    }

    function checkUserSession() {
      // 1. Verifica se a URL contém um parâmetro de agendamento (Ex: ?pro=ID_DO_PROFISSIONAL)
      const urlParams = new URLSearchParams(window.location.search);
      const proId = urlParams.get('pro');

      if (proId) {
        // Exibe diretamente a tela da cliente
        document.getElementById('appNav').style.display = 'none';
        document.getElementById('btnLogout').style.display = 'none';
        showOnlyView('clientBookingView');
        loadClientViewData(proId);
        return;
      }

      // 2. Senão, verifica se o profissional está autenticado
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          currentUser = session.user;
          document.getElementById('appNav').style.display = 'flex';
          document.getElementById('btnLogout').style.display = 'block';
          showOnlyView('proDashboardView');
          generateProfessionalLink(currentUser.id);
        } else {
          document.getElementById('appNav').style.display = 'none';
          document.getElementById('btnLogout').style.display = 'none';
          showOnlyView('authView');
        }
      });
    }

    // Gera o Link Exclusivo do Profissional baseado na URL atual e no seu ID
    function generateProfessionalLink(userId) {
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?pro=${userId}`;
      document.getElementById('shareLinkInput').value = shareUrl;
    }

    function copyShareLink() {
      const copyText = document.getElementById('shareLinkInput');
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert('Link de agendamento copiado com sucesso!');
    }

    function loadClientViewData(proId) {
      document.getElementById('cliName').innerText = "Atendimento Profissional";
      document.getElementById('cliAddress').innerText = "ID do Profissional: " + proId;
    }

    function showOnlyView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');
    }

    function switchView(viewId) {
      showOnlyView(viewId);
    }

    supabaseClient.auth.onAuthStateChange(() => {
      checkUserSession();
    });

    checkUserSession();
  </script>
</body>
</html>
